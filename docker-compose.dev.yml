# =============================================================================
# Relação com o ecad-authz (plataforma de autorização fina)
# -----------------------------------------------------------------------------
# O ecad-authz vive em um repositório separado:
#   /home/tsgomes/github-tassosgomes/ecad-authz/
# A forma canônica de subir o ambiente do ecad-authz é:
#   docker compose -f /home/tsgomes/github-tassosgomes/ecad-authz/infra/dev/docker-compose.yml up -d
# Esse compose sobe Postgres dedicado (porta 5432 do compose dele — conflita com o
# mcad-postgres, então use bridge isolada ou execute em hosts/portas distintas),
# Redis e Keycloak para autenticar a Admin UI do authz.
#
# Os serviços abaixo (`ecad-authz-*`) são STUBS opcionais que servem para:
#   1) Subir o backend do ecad-authz dentro da mesma rede do mcad, quando houver
#      uma imagem publicada (ex.: `ghcr.io/tassosgomes/ecad-authz:dev`).
#   2) Permitir que as APIs (cadastro, identificacao, arrecadacao) chamem
#      http://ecad-authz:8085/v1/* sem depender de DNS externo.
#
# TODO: enquanto não há imagem publicada do ecad-authz, suba o backend pelo compose
#       do próprio repositório (acima) e deixe os stubs abaixo desativados via
#       perfil `authz`. Para ativá-los após publicar imagem:
#         docker compose -f docker-compose.dev.yml --profile authz up -d
# =============================================================================

services:
  # ── ecad-authz (stub local; ativado pelo perfil `authz`) ──────────
  ecad-authz-postgres:
    image: postgres:16-alpine
    container_name: mcad-ecad-authz-postgres
    profiles: ["authz"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecad_authz
      POSTGRES_USER: authz
      POSTGRES_PASSWORD: ${AUTHZ_DB_PASSWORD:-authz}
    ports:
      - "55432:5432" # 55432 para não conflitar com mcad-postgres
    volumes:
      - mcad_authz_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authz -d ecad_authz"]
      interval: 5s
      timeout: 5s
      retries: 10

  ecad-authz-redis:
    image: redis:7-alpine
    container_name: mcad-ecad-authz-redis
    profiles: ["authz"]
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "56379:6379"
    volumes:
      - mcad_authz_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ecad-authz:
    # TODO: substituir pela imagem oficial quando publicada. Enquanto isso,
    # gerar localmente com `docker build` no repositório do ecad-authz.
    image: ${ECAD_AUTHZ_IMAGE:-ecad-authz:local}
    container_name: mcad-ecad-authz
    profiles: ["authz"]
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8085
      DB_HOST: ecad-authz-postgres
      DB_PORT: 5432
      DB_NAME: ecad_authz
      DB_USER: authz
      DB_PASSWORD: ${AUTHZ_DB_PASSWORD:-authz}
      REDIS_HOST: ecad-authz-redis
      REDIS_PORT: 6379
    ports:
      - "8085:8085"
    depends_on:
      ecad-authz-postgres:
        condition: service_healthy
      ecad-authz-redis:
        condition: service_healthy

  # ── Postgres ──────────────────────────────────────────────────────
  mcad-postgres:
    image: postgres:16-alpine
    container_name: mcad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gestauto
      POSTGRES_PASSWORD: gestauto123
      POSTGRES_DB: mcad
    ports:
      - "5432:5432"
    volumes:
      - mcad_pg_data:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestauto -d mcad"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── RabbitMQ ──────────────────────────────────────────────────────
  mcad-rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: mcad-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: mcad
      RABBITMQ_DEFAULT_PASS: mcad
      RABBITMQ_DEFAULT_VHOST: mcad
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - mcad_rmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Schema Registry ───────────────────────────────────────────────
  mcad-schema-registry:
    build:
      context: ./infra/schemas
      dockerfile: Dockerfile
    container_name: mcad-schema-registry
    restart: unless-stopped
    ports:
      - "5310:80"

  # ── MinIO ─────────────────────────────────────────────────────────
  mcad-minio:
    image: minio/minio:latest
    container_name: mcad-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mcadadmin
      MINIO_ROOT_PASSWORD: mcadadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - mcad_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  distribuicao-api:
    build:
      context: ./services/distribuicao-api
      dockerfile: Dockerfile
    container_name: mcad-distribuicao-api
    restart: unless-stopped
    environment:
      SERVER_PORT: 5004
      DB_HOST: mcad-postgres
      DB_PORT: 5432
      DB_NAME: mcad
      DB_USER_DISTRIBUICAO: distribuicao_app
      DB_PASSWORD_DISTRIBUICAO: ${DB_PASSWORD_DISTRIBUICAO:-distribuicao_app}
      DB_SCHEMA_DISTRIBUICAO: distribuicao
      RABBITMQ_HOST: mcad-rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: mcad
      RABBITMQ_PASSWORD: mcad
      RABBITMQ_VHOST: mcad
      OIDC_AUTHORITY: http://mcad-keycloak:8080/realms/mcad
      AUTH_ENABLED: "false"
    ports:
      - "5004:5004"
    depends_on:
      mcad-postgres:
        condition: service_healthy
      mcad-rabbitmq:
        condition: service_healthy

  bff:
    build:
      context: ./services/bff
      dockerfile: Dockerfile
    container_name: mcad-bff
    restart: unless-stopped
    environment:
      BFF_PORT: 5200
      BFF_HOST: 0.0.0.0
      CADASTRO_API_BASE_URL: http://host.docker.internal:5001/api/v1
      IDENTIFICACAO_API_BASE_URL: http://host.docker.internal:5100/api/v1
      ARRECADACAO_API_BASE_URL: http://host.docker.internal:5003/api/v1
      DISTRIBUICAO_API_BASE_URL: http://distribuicao-api:5004/api/v1
      AUDITORIA_API_BASE_URL: https://api-audit.tasso.dev.br/api/v1
      AUTHZ_UPSTREAM_BASE_URL: https://mcad-authz.tasso.dev.br/v1
      AI_ORCHESTRATOR_BASE_URL: http://ai-orchestrator:5300/v1
      BFF_CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "5200:5200"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - ai-orchestrator
      - distribuicao-api

  ai-orchestrator:
    build:
      context: ./services/ai-orchestrator
      dockerfile: Dockerfile
    container_name: mcad-ai-orchestrator
    restart: unless-stopped
    environment:
      AI_PORT: 5300
      AI_HOST: 0.0.0.0
      AI_ENVIRONMENT: local
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      AI_STORAGE_URL: ${AI_STORAGE_URL:-}
      AI_TOOL_TIMEOUT_MS: 10000
      AI_MAX_MESSAGE_CHARS: 4000
      AI_TRACE_PROMPTS: "false"
      CADASTRO_API_BASE_URL: http://host.docker.internal:5001/api/v1
      IDENTIFICACAO_API_BASE_URL: http://host.docker.internal:5100/api/v1
      ARRECADACAO_API_BASE_URL: http://host.docker.internal:5003/api/v1
      DISTRIBUICAO_API_BASE_URL: http://distribuicao-api:5004/api/v1
      AUDITORIA_API_BASE_URL: https://api-audit.tasso.dev.br/api/v1
      AUTHZ_UPSTREAM_BASE_URL: https://mcad-authz.tasso.dev.br/v1
    ports:
      - "5300:5300"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - distribuicao-api

# NOTE: cadastro-api e identificacao-api rodam no host via `dotnet run`
# NOTE: arrecadacao-api rodará no host via Spring Boot na porta 5003
# NOTE: distribuicao-api pode rodar via Docker Compose ou host via `./dev.sh`
# Ver README para instruções de execução local das APIs

volumes:
  mcad_pg_data:
  mcad_rmq_data:
  mcad_minio_data:
  mcad_authz_pg_data:
  mcad_authz_redis_data:
