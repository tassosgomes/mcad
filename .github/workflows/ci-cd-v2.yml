# ─────────────────────────────────────────────────────────────────────────────
# ci-cd-v2.yml — Shadow pipeline (Phase 1)
#
# Runs IN PARALLEL with the current ci-cd.yml. Calls the reusable
# _service-build.yml for each service. In Phase 1:
#   - push-images: false → validates tests + Docker build, NO registry push
#   - NOT a required check (branch protection still points to ci-cd.yml)
#
# After cutover (Phase 3): set push-images to true, disable ci-cd.yml, and
# add ci-cd-v2 to branch protection.
#
# See: docs/ops/ci-cd-improvement-plan.md § 4 (Shadow Pipeline strategy)
# ─────────────────────────────────────────────────────────────────────────────
name: CI/CD v2 (shadow)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Permissions must be declared at caller level so the reusable workflow
# (_service-build.yml) can inherit id-token + attestations for Cosign/SLSA.
permissions:
  contents: read
  packages: read
  id-token: write
  attestations: write

concurrency:
  group: ci-cd-v2-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# Path filter: only build services that changed (reduces CI minutes in PRs).
# Comment out during initial shadow calibration to compare full parity with v1.
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Detect which services changed (for path filtering — future optimization)
  # ───────────────────────────────────────────────────────────────────────────
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      cadastro: ${{ steps.filter.outputs.cadastro }}
      identificacao: ${{ steps.filter.outputs.identificacao }}
      arrecadacao: ${{ steps.filter.outputs.arrecadacao }}
      distribuicao: ${{ steps.filter.outputs.distribuicao }}
      bff: ${{ steps.filter.outputs.bff }}
      identity-sync: ${{ steps.filter.outputs.identity-sync }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cadastro:
              - 'services/cadastro-api/**'
              - '.github/workflows/_service-build.yml'
              - '.github/workflows/ci-cd-v2.yml'
            identificacao:
              - 'services/identificacao-api/**'
              - '.github/workflows/_service-build.yml'
              - '.github/workflows/ci-cd-v2.yml'
            arrecadacao:
              - 'services/arrecadacao-api/**'
              - '.github/workflows/_service-build.yml'
              - '.github/workflows/ci-cd-v2.yml'
            distribuicao:
              - 'services/distribuicao-api/**'
              - '.github/workflows/_service-build.yml'
              - '.github/workflows/ci-cd-v2.yml'
            bff:
              - 'services/bff/**'
              - '.github/workflows/_service-build.yml'
              - '.github/workflows/ci-cd-v2.yml'
            identity-sync:
              - 'services/identity-sync-api/**'
              - '.github/workflows/_service-build.yml'
              - '.github/workflows/ci-cd-v2.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/_service-build.yml'
              - '.github/workflows/ci-cd-v2.yml'

  # ───────────────────────────────────────────────────────────────────────────
  # Cadastro API (.NET 8)
  # ───────────────────────────────────────────────────────────────────────────
  cadastro-api:
    needs: changes
    if: ${{ needs.changes.outputs.cadastro == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/_service-build.yml
    with:
      service-name: cadastro-api
      language: dotnet
      working-directory: services/cadastro-api
      dockerfile: services/cadastro-api/Dockerfile
      context: .
      image-name: mcad-cadastro-api
      restore-command: dotnet restore Cadastro.sln --configfile .ci/NuGet.config
      test-command: >-
        dotnet test 5-Tests/Cadastro.UnitTests/Cadastro.UnitTests.csproj
        --configuration Release --no-restore
        --logger "trx;LogFileName=cadastro-unit.trx"
      test-results-path: 5-Tests/**/TestResults/*.trx
      docker-secret-files: nuget_config=services/cadastro-api/.ci/NuGet.config
      push-images: false
    secrets: inherit

  # ───────────────────────────────────────────────────────────────────────────
  # Identificacao API (.NET 8)
  # ───────────────────────────────────────────────────────────────────────────
  identificacao-api:
    needs: changes
    if: ${{ needs.changes.outputs.identificacao == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/_service-build.yml
    with:
      service-name: identificacao-api
      language: dotnet
      working-directory: services/identificacao-api
      dockerfile: services/identificacao-api/Dockerfile
      context: .
      image-name: mcad-identificacao-api
      restore-command: >-
        dotnet restore 5-Tests/Identificacao.Tests/Identificacao.Tests.csproj
        --configfile .ci/NuGet.config
      test-command: >-
        dotnet test 5-Tests/Identificacao.Tests/Identificacao.Tests.csproj
        --configuration Release --no-restore
        --logger "trx;LogFileName=identificacao-unit.trx"
      test-results-path: 5-Tests/**/TestResults/*.trx
      docker-secret-files: nuget_config=services/identificacao-api/.ci/NuGet.config
      push-images: false
    secrets: inherit

  # ───────────────────────────────────────────────────────────────────────────
  # Arrecadacao API (Java 21 / Maven)
  # ───────────────────────────────────────────────────────────────────────────
  arrecadacao-api:
    needs: changes
    if: ${{ needs.changes.outputs.arrecadacao == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/_service-build.yml
    with:
      service-name: arrecadacao-api
      language: maven
      working-directory: services/arrecadacao-api
      dockerfile: services/arrecadacao-api/Dockerfile
      context: services/arrecadacao-api
      image-name: mcad-arrecadacao-api
      test-command: >-
        mvn -B -ntp -s .mvn/settings.xml test -pl '!arrecadacao-tests'
      test-results-path: "**/target/surefire-reports/**"
      docker-secret-files: maven_settings=services/arrecadacao-api/.ci/settings.xml
      push-images: false
    secrets: inherit

  # ───────────────────────────────────────────────────────────────────────────
  # Distribuicao API (Java 21 / Maven)
  # ───────────────────────────────────────────────────────────────────────────
  distribuicao-api:
    needs: changes
    if: ${{ needs.changes.outputs.distribuicao == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/_service-build.yml
    with:
      service-name: distribuicao-api
      language: maven
      working-directory: services/distribuicao-api
      dockerfile: services/distribuicao-api/Dockerfile
      context: services/distribuicao-api
      image-name: mcad-distribuicao-api
      test-command: >-
        mvn -B -ntp -s .mvn/settings.xml test
        -Dtest='!*IntegrationTest' -Dsurefire.failIfNoSpecifiedTests=false
      test-results-path: "**/target/surefire-reports/**"
      docker-secret-files: maven_settings=services/distribuicao-api/.ci/settings.xml
      push-images: false
    secrets: inherit

  # ───────────────────────────────────────────────────────────────────────────
  # BFF (Node.js / Fastify)
  # ───────────────────────────────────────────────────────────────────────────
  bff:
    needs: changes
    if: ${{ needs.changes.outputs.bff == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/_service-build.yml
    with:
      service-name: bff
      language: node
      working-directory: services/bff
      dockerfile: services/bff/Dockerfile
      context: services/bff
      image-name: mcad-bff
      test-command: npm test
      push-images: false
    secrets: inherit

  # ───────────────────────────────────────────────────────────────────────────
  # Identity Sync API (Node.js / Fastify)
  # ───────────────────────────────────────────────────────────────────────────
  identity-sync-api:
    needs: changes
    if: ${{ needs.changes.outputs.identity-sync == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/_service-build.yml
    with:
      service-name: identity-sync-api
      language: node
      working-directory: services/identity-sync-api
      dockerfile: services/identity-sync-api/Dockerfile
      context: services/identity-sync-api
      image-name: mcad-identity-sync-api
      test-command: npm test
      push-images: false
    secrets: inherit

  # ───────────────────────────────────────────────────────────────────────────
  # Frontend (React 19 / Vite)
  # ───────────────────────────────────────────────────────────────────────────
  frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/_service-build.yml
    with:
      service-name: frontend
      language: node
      working-directory: frontend
      dockerfile: frontend/Dockerfile
      context: frontend
      image-name: mcad-frontend
      test-command: npm test
      push-images: false
    secrets: inherit

  # ───────────────────────────────────────────────────────────────────────────
  # Summary gate (mirrors ci-cd-summary from v1)
  # ───────────────────────────────────────────────────────────────────────────
  ci-cd-v2-summary:
    name: ci-cd-v2 summary
    runs-on: ubuntu-latest
    needs:
      - changes
      - cadastro-api
      - identificacao-api
      - arrecadacao-api
      - distribuicao-api
      - bff
      - identity-sync-api
      - frontend
    if: always()
    steps:
      - name: Aggregate result
        run: |
          set -e
          echo "═══ CI/CD v2 (shadow) — Summary ═══"
          echo ""
          echo "cadastro:        ${{ needs.cadastro-api.result }}"
          echo "identificacao:   ${{ needs.identificacao-api.result }}"
          echo "arrecadacao:     ${{ needs.arrecadacao-api.result }}"
          echo "distribuicao:    ${{ needs.distribuicao-api.result }}"
          echo "bff:             ${{ needs.bff.result }}"
          echo "identity-sync:   ${{ needs.identity-sync-api.result }}"
          echo "frontend:        ${{ needs.frontend.result }}"
          echo ""
          echo "ℹ️  SHADOW MODE: This pipeline is non-blocking in Phase 1."
          echo "    Compare results with ci-cd.yml (v1) for parity."
          echo ""

          # Treat skipped jobs (path filter) as success
          check_result() {
            local name="$1"
            local result="$2"
            if [[ "$result" == "skipped" ]]; then
              echo "$name: skipped (no changes detected)"
              return 0
            fi
            if [[ "$result" != "success" ]]; then
              echo "❌ $name: FAILED ($result)"
              return 1
            fi
            echo "✅ $name: success"
            return 0
          }

          overall=0
          check_result "cadastro-api"      "${{ needs.cadastro-api.result }}"      || overall=1
          check_result "identificacao-api" "${{ needs.identificacao-api.result }}" || overall=1
          check_result "arrecadacao-api"   "${{ needs.arrecadacao-api.result }}"   || overall=1
          check_result "distribuicao-api"  "${{ needs.distribuicao-api.result }}"  || overall=1
          check_result "bff"               "${{ needs.bff.result }}"               || overall=1
          check_result "identity-sync-api" "${{ needs.identity-sync-api.result }}" || overall=1
          check_result "frontend"          "${{ needs.frontend.result }}"          || overall=1

          if [[ $overall -ne 0 ]]; then
            echo ""
            echo "❌ One or more service jobs failed."
            exit 1
          fi
          echo ""
          echo "✅ All service jobs succeeded (or skipped via path filter)."
