name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_NAMESPACE: tassosgomes
  IMAGE_TAG: ${{ github.run_number }}
  REGISTRY: docker.io

jobs:
  # ---------------------------------------------------------------------------
  # Cadastro API (.NET 8)
  # ---------------------------------------------------------------------------
  cadastro-api:
    name: cadastro-api · test+build+push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/cadastro-api
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Cadastro.sln

      - name: Run unit tests
        run: dotnet test 5-Tests/Cadastro.UnitTests/Cadastro.UnitTests.csproj --configuration Release --no-restore --logger "trx;LogFileName=cadastro-unit.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cadastro-test-results
          path: services/cadastro-api/5-Tests/**/TestResults/*.trx
          if-no-files-found: ignore

      - name: Set up Docker Buildx
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: services/cadastro-api
          file: services/cadastro-api/Dockerfile
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/mcad-cadastro-api:${{ env.IMAGE_TAG }}
            ${{ env.DOCKERHUB_NAMESPACE }}/mcad-cadastro-api:latest
          cache-from: type=gha,scope=cadastro-api
          cache-to: type=gha,mode=max,scope=cadastro-api

  # ---------------------------------------------------------------------------
  # Identificacao API (.NET 8)
  # ---------------------------------------------------------------------------
  identificacao-api:
    name: identificacao-api · test+build+push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/identificacao-api
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore 5-Tests/Identificacao.Tests/Identificacao.Tests.csproj

      - name: Run unit tests
        run: dotnet test 5-Tests/Identificacao.Tests/Identificacao.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=identificacao-unit.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identificacao-test-results
          path: services/identificacao-api/5-Tests/**/TestResults/*.trx
          if-no-files-found: ignore

      - name: Set up Docker Buildx
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: services/identificacao-api
          file: services/identificacao-api/Dockerfile
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/mcad-identificacao-api:${{ env.IMAGE_TAG }}
            ${{ env.DOCKERHUB_NAMESPACE }}/mcad-identificacao-api:latest
          cache-from: type=gha,scope=identificacao-api
          cache-to: type=gha,mode=max,scope=identificacao-api

  # ---------------------------------------------------------------------------
  # Arrecadacao API (Java 21 / Maven)
  # Unit tests live in arrecadacao-domain and arrecadacao-application.
  # The arrecadacao-tests module holds integration tests (Testcontainers) and
  # is excluded here.
  # ---------------------------------------------------------------------------
  arrecadacao-api:
    name: arrecadacao-api · test+build+push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/arrecadacao-api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run unit tests (skip integration module)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
        run: mvn -B -ntp -s .mvn/settings.xml test -pl '!arrecadacao-tests'

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arrecadacao-test-results
          path: services/arrecadacao-api/**/target/surefire-reports/**
          if-no-files-found: ignore

      - name: Set up Docker Buildx
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Maven settings for Docker build
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p .ci
          cat > .ci/settings.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GH_PACKAGES_READ_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: services/arrecadacao-api
          file: services/arrecadacao-api/Dockerfile
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/mcad-arrecadacao-api:${{ env.IMAGE_TAG }}
            ${{ env.DOCKERHUB_NAMESPACE }}/mcad-arrecadacao-api:latest
          cache-from: type=gha,scope=arrecadacao-api
          cache-to: type=gha,mode=max,scope=arrecadacao-api
          secret-files: |
            maven_settings=services/arrecadacao-api/.ci/settings.xml

  # ---------------------------------------------------------------------------
  # Distribuicao API (Java 21 / Maven)
  # The distribuicao-tests module mixes unit and integration tests. Integration
  # classes use the *IntegrationTest suffix; we exclude them via Surefire's
  # negation pattern.
  # ---------------------------------------------------------------------------
  distribuicao-api:
    name: distribuicao-api · test+build+push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/distribuicao-api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run unit tests (skip *IntegrationTest classes)
        run: mvn -B -ntp test -Dtest='!*IntegrationTest' -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distribuicao-test-results
          path: services/distribuicao-api/**/target/surefire-reports/**
          if-no-files-found: ignore

      - name: Set up Docker Buildx
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: services/distribuicao-api
          file: services/distribuicao-api/Dockerfile
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/mcad-distribuicao-api:${{ env.IMAGE_TAG }}
            ${{ env.DOCKERHUB_NAMESPACE }}/mcad-distribuicao-api:latest
          cache-from: type=gha,scope=distribuicao-api
          cache-to: type=gha,mode=max,scope=distribuicao-api

  # ---------------------------------------------------------------------------
  # BFF (Node.js / Fastify)
  # ---------------------------------------------------------------------------
  bff:
    name: bff · test+build+push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/bff
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/bff/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Set up Docker Buildx
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: services/bff
          file: services/bff/Dockerfile
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/mcad-bff:${{ env.IMAGE_TAG }}
            ${{ env.DOCKERHUB_NAMESPACE }}/mcad-bff:latest
          cache-from: type=gha,scope=bff
          cache-to: type=gha,mode=max,scope=bff

  # ---------------------------------------------------------------------------
  # Summary gate so branch protection can require a single check.
  # ---------------------------------------------------------------------------
  ci-cd-summary:
    name: ci-cd summary
    runs-on: ubuntu-latest
    needs:
      - cadastro-api
      - identificacao-api
      - arrecadacao-api
      - distribuicao-api
      - bff
    if: always()
    steps:
      - name: Aggregate result
        run: |
          set -e
          echo "cadastro:        ${{ needs.cadastro-api.result }}"
          echo "identificacao:   ${{ needs.identificacao-api.result }}"
          echo "arrecadacao:     ${{ needs.arrecadacao-api.result }}"
          echo "distribuicao:    ${{ needs.distribuicao-api.result }}"
          echo "bff:             ${{ needs.bff.result }}"
          if [[ "${{ needs.cadastro-api.result }}"      != "success" ]] \
            || [[ "${{ needs.identificacao-api.result }}" != "success" ]] \
            || [[ "${{ needs.arrecadacao-api.result }}"   != "success" ]] \
            || [[ "${{ needs.distribuicao-api.result }}"  != "success" ]] \
            || [[ "${{ needs.bff.result }}"               != "success" ]]; then
            echo "One or more service jobs failed."
            exit 1
          fi
          echo "All service jobs succeeded."
