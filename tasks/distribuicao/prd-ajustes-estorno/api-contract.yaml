    ProblemDetails:
      type: object
      description: "Formato de erro RFC 7807 (ProblemDetails)"
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: URI de referência do tipo de erro
          example: "https://tools.ietf.org/html/rfc7231#section-6.5.4"
        title:
          type: string
          description: Título curto do erro
          example: "Resource Not Found"
        status:
          type: integer
          description: HTTP status code
          example: 404
        detail:
          type: string
          description: Descrição detalhada do erro
          example: "Ajuste de estorno não encontrado"
        instance:
          type: string
          description: Path da requisição que gerou o erro
          example: "/api/v1/ajustes-estorno/4f8f7f3e-5a63-4c8e-97b8-c6f6b595b1dd"
        traceId:
          type: string
          nullable: true
          description: ID de rastreamento (presente em erros 5xx)
          example: "0HN4B2E8M0T0K:00000001"
