# Overlay de exemplos (Microcks APIExamples) — artefato SECUNDÁRIO.
# Mescla exemplos sobre o openapi.json (primário) sem sujar o spec gerado.
# metadata.name/version DEVEM casar com o serviço importado (Identificação API : v1).
# Importar com mainArtifact=false.
apiVersion: mocks.microcks.io/v1alpha1
kind: APIExamples
metadata:
  name: Identificação API
  version: v1
operations:
  # Lista de rubricas — array nu (sem envelope de paginação).
  'GET /api/v1/rubricas':
    lista-rubricas:
      request:
        headers:
          Accept: application/json
      response:
        status: '200'
        mediaType: application/json
        body:
          - id: 8f1c2d3e-4a5b-6c7d-8e9f-0a1b2c3d4e5f
            sigla: RADIO
            nome: Execução em rádio
            exigeClassificacao: true
          - id: 1b2c3d4e-5f6a-7b8c-9d0e-1f2a3b4c5d6e
            sigla: TV
            nome: Execução em televisão
            exigeClassificacao: true
          - id: 2c3d4e5f-6a7b-8c9d-0e1f-2a3b4c5d6e7f
            sigla: SHOW
            nome: Execução ao vivo em shows
            exigeClassificacao: false

  # Lista de tipos de utilização — array nu (sem envelope de paginação).
  'GET /api/v1/tipos-utilizacao':
    lista-tipos-utilizacao:
      request:
        headers:
          Accept: application/json
      response:
        status: '200'
        mediaType: application/json
        body:
          - id: 3d4e5f6a-7b8c-9d0e-1f2a-3b4c5d6e7f80
            sigla: TEMA
            descricao: Tema de abertura ou encerramento
            peso: 1.0
          - id: 4e5f6a7b-8c9d-0e1f-2a3b-4c5d6e7f8091
            sigla: BG
            descricao: Música incidental de fundo (background)
            peso: 0.5
          - id: 5f6a7b8c-9d0e-1f2a-3b4c-5d6e7f8091a2
            sigla: INSERCAO
            descricao: Inserção pontual em programa
            peso: 0.3

  # Lista de usuários de música — envelope { items, pagination }.
  'GET /api/v1/usuarios-musica':
    lista-usuarios-musica:
      request:
        headers:
          Accept: application/json
      response:
        status: '200'
        mediaType: application/json
        body:
          items:
            - id: 9a8b7c6d-5e4f-3a2b-1c0d-9e8f7a6b5c4d
              razaoSocial: Rádio Cidade FM Ltda
              cnpj: 12.345.678/0001-90
            - id: 8b7c6d5e-4f3a-2b1c-0d9e-8f7a6b5c4d3e
              razaoSocial: Televisão Bandeirantes do Sul S.A.
              cnpj: 23.456.789/0001-01
            - id: 7c6d5e4f-3a2b-1c0d-9e8f-7a6b5c4d3e2f
              razaoSocial: Casa de Shows Tom Brasil Eventos Ltda
              cnpj: 34.567.890/0001-12
          pagination:
            page: 1
            size: 10
            total: 3
            totalPages: 1

  # Lista de captações — envelope { data, pagination }.
  'GET /api/v1/captacoes':
    lista-captacoes:
      request:
        headers:
          Accept: application/json
      response:
        status: '200'
        mediaType: application/json
        body:
          data:
            - id: a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
              rubrica:
                id: 8f1c2d3e-4a5b-6c7d-8e9f-0a1b2c3d4e5f
                sigla: RADIO
                nome: Execução em rádio
                exigeClassificacao: true
              periodo: '2026-05-01'
              usuarioMusicaId: 9a8b7c6d-5e4f-3a2b-1c0d-9e8f7a6b5c4d
              usuarioMusicaNome: Rádio Cidade FM Ltda
              status: Aberta
              analistaResponsavel:
                id: c0ffee00-1111-2222-3333-444455556666
                nome: Mariana Alves
              criadoEm: '2026-05-02T09:15:00Z'
              atualizadoEm: '2026-05-10T14:30:00Z'
            - id: b2c3d4e5-f6a7-8b9c-0d1e-2f3a4b5c6d7e
              rubrica:
                id: 1b2c3d4e-5f6a-7b8c-9d0e-1f2a3b4c5d6e
                sigla: TV
                nome: Execução em televisão
                exigeClassificacao: true
              periodo: '2026-04-01'
              usuarioMusicaId: 8b7c6d5e-4f3a-2b1c-0d9e-8f7a6b5c4d3e
              usuarioMusicaNome: Televisão Bandeirantes do Sul S.A.
              status: Fechada
              analistaResponsavel:
                id: c0ffee00-7777-8888-9999-aaaabbbbcccc
                nome: Rafael Costa
              criadoEm: '2026-04-03T08:00:00Z'
              atualizadoEm: '2026-05-05T18:45:00Z'
          pagination:
            page: 1
            size: 10
            total: 2
            totalPages: 1

  # Detalhe da captação — objeto nu, acrescenta resumoExecucoes.
  'GET /api/v1/captacoes/{id}':
    captacao-show:
      request:
        parameters:
          id: a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
        headers:
          Accept: application/json
      response:
        status: '200'
        mediaType: application/json
        body:
          id: a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
          rubrica:
            id: 8f1c2d3e-4a5b-6c7d-8e9f-0a1b2c3d4e5f
            sigla: RADIO
            nome: Execução em rádio
            exigeClassificacao: true
          periodo: '2026-05-01'
          usuarioMusicaId: 9a8b7c6d-5e4f-3a2b-1c0d-9e8f7a6b5c4d
          usuarioMusicaNome: Rádio Cidade FM Ltda
          status: Aberta
          analistaResponsavel:
            id: c0ffee00-1111-2222-3333-444455556666
            nome: Mariana Alves
          resumoExecucoes:
            total: 120
            identificadas: 98
            pendentes: 22
          criadoEm: '2026-05-02T09:15:00Z'
          atualizadoEm: '2026-05-10T14:30:00Z'
