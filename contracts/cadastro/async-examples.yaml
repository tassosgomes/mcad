# (chamado pelo export-contracts.sh). Mantem o spec gerado limpo: o payload
# realista vive aqui, como o examples.yaml dos mocks REST.
#
# Envelope = CloudEvents 1.0 structured (application/cloudevents+json):
# o `data` casa com o schema do payload (components/schemas/*Payload).
# Chave = nome da mensagem (components/messages/<Nome>).
