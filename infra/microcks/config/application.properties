# Microcks — config compartilhada app (Spring) + async-minion (Quarkus).
# Fase 2b (async mocking). Montada em /deployments/config/application.properties
# nos dois serviços. O webapp lê as chaves sem prefixo; o minion lê as
# %docker-compose.* sob QUARKUS_PROFILE=docker-compose.
#
# LOCAL apenas: credenciais default (microcks/microcks, guest do LavinMQ).
# No Swarm essas chaves de AMQP vêm de uma config externa renderizada (secrets).

async-api.enabled=true

# Conexão do minion de volta ao webapp
%docker-compose.io.github.microcks.minion.async.client.MicrocksAPIConnector/mp-rest/url=http://app:8080

# Bus interno Kafka (webapp <-> minion)
%docker-compose.kafka.bootstrap.servers=kafka:19092
%docker-compose.mp.messaging.incoming.microcks-services-updates.bootstrap.servers=kafka:19092
%docker-compose.mp.messaging.incoming.microcks-asyncapi-triggers.enable.auto.commit=false
%docker-compose.mp.messaging.incoming.microcks-asyncapi-triggers.bootstrap.servers=kafka:19092

# Protocolos de destino suportados (inclui AMQP para o LavinMQ)
%docker-compose.minion.supported-bindings=KAFKA,WS,AMQP

# Alvo AMQP 0.9.1 dos mocks: LavinMQ (drop-in RabbitMQ)
%docker-compose.amqp.server=lavinmq:5672
%docker-compose.amqp.username=guest
%docker-compose.amqp.password=guest
