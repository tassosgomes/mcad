server:
  port: ${SERVER_PORT:5004}

spring:
  application:
    name: distribuicao-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mcad}?currentSchema=${DB_SCHEMA_DISTRIBUICAO:distribuicao}
    username: ${DB_USER_DISTRIBUICAO:distribuicao_app}
    password: ${DB_PASSWORD_DISTRIBUICAO:distribuicao_app}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: distribuicao
  flyway:
    enabled: true
    schemas: distribuicao
    default-schema: distribuicao
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:mcad}
    password: ${RABBITMQ_PASSWORD:mcad}
    virtual-host: ${RABBITMQ_VHOST:mcad}
    listener:
      simple:
        default-requeue-rejected: false
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_AUTHORITY:http://localhost:8080/realms/mcad}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

app:
  cors:
    allowed-origins: ${DISTRIBUICAO_CORS_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS:http://localhost:5173}}
  rabbitmq:
    exchange: arrecadacao.events
    queues:
      rubricas: distribuicao.rubricas
      rol: ${RABBITMQ_QUEUE_ROL:distribuicao.rol}
      verba: ${RABBITMQ_QUEUE_VERBA:distribuicao.verba}
    routing-keys:
      rubrica-criada: arrecadacao.rubrica.criada
      rubrica-atualizada: arrecadacao.rubrica.atualizada
    exchanges:
      distribuicao: ${RABBITMQ_EXCHANGE_DISTRIBUICAO:distribuicao.events}
  outbox:
    publisher:
      poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:5000}
  identity-events:
    exchange: ${IDENTITY_EVENTS_EXCHANGE:identity.events}
    queue: ${IDENTITY_EVENTS_QUEUE:distribuicao.identity.users}
    routing-key: ${IDENTITY_EVENTS_ROUTING_KEY:identity.user.*}
  security:
    auth-enabled: ${AUTH_ENABLED:false}
  integrations:
    cadastro:
      base-url: ${CADASTRO_BASE_URL:http://localhost:5001}
      token-strategy: ${CADASTRO_TOKEN_STRATEGY:ANALYST_OR_SERVICE}
      service-token: ${CADASTRO_SERVICE_TOKEN:}
      connect-timeout: ${CADASTRO_CONNECT_TIMEOUT:2s}
      read-timeout: ${CADASTRO_READ_TIMEOUT:10s}

audit:
  enabled: ${AUDIT_ENABLED:true}
  mode: ${AUDIT_MODE:OUTBOX_RABBITMQ}
  endpoint: ${AUDIT_ENDPOINT:http://localhost:8080/api/v1/audit/events}
  exchange: ${AUDIT_RABBITMQ_EXCHANGE:audit.events.exchange.v1}
  routing-key: ${AUDIT_RABBITMQ_ROUTING_KEY:audit.event.v1}
  relay-batch-size: ${AUDIT_RELAY_BATCH_SIZE:50}
  relay-lock-ttl: ${AUDIT_RELAY_LOCK_TTL:2m}
  relay-delay-ms: ${AUDIT_RELAY_DELAY_MS:5000}

ecad:
  authz:
    base-url: ${ECAD_AUTHZ_BASE_URL:http://localhost:8081}
    catalog:
      domain: distribuicao
      register-on-startup: ${ECAD_AUTHZ_REGISTER_ON_STARTUP:true}
    cache:
      local:
        ttl-seconds: 60
      remote:
        enabled: ${ECAD_AUTHZ_REMOTE_CACHE:true}
        ttl-seconds: 300
