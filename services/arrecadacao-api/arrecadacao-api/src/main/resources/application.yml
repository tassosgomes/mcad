server:
  port: 5003

spring:
  application:
    name: arrecadacao-api
  datasource:
    url: jdbc:postgresql://${ARRECADACAO_DB_HOST:localhost}:${ARRECADACAO_DB_PORT:5432}/${ARRECADACAO_DB_NAME:mcad}?currentSchema=${ARRECADACAO_DB_SCHEMA:arrecadacao}&sslmode=${ARRECADACAO_DB_SSL_MODE:disable}
    username: ${ARRECADACAO_DB_USER:arrecadacao_svc}
    password: ${ARRECADACAO_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: arrecadacao
  flyway:
    enabled: true
    schemas: arrecadacao
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:mcad}
    password: ${RABBITMQ_PASSWORD:mcad}
    virtual-host: ${RABBITMQ_VHOST:mcad}
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_AUTHORITY:http://localhost:8080/realms/mcad}
  data:
    redis:
      host: ${AUTHZ_REDIS_HOST:localhost}
      port: ${AUTHZ_REDIS_PORT:6379}
      timeout: ${AUTHZ_REDIS_TIMEOUT:50ms}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  cors:
    allowed-origins: ${ARRECADACAO_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    auth-enabled: ${AUTH_ENABLED:true}
  outbox:
    publisher:
      poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:5000}
  identity-events:
    exchange: ${IDENTITY_EVENTS_EXCHANGE:identity.events}
    queue: ${IDENTITY_EVENTS_QUEUE:arrecadacao.identity.users}
    routing-key: ${IDENTITY_EVENTS_ROUTING_KEY:identity.user.*}
  distribuicao-events:
    exchange: ${DISTRIBUICAO_EVENTS_EXCHANGE:distribuicao.events}
    queue: ${DISTRIBUICAO_EVENTS_QUEUE:arrecadacao.distribuicao.processos}
    routing-key: ${DISTRIBUICAO_EVENTS_ROUTING_KEY:distribuicao.processo.*}

ecad:
  authz:
    enabled: ${AUTHZ_ENABLED:false}
    base-url: ${AUTHZ_BASE_URL:http://localhost:8085}
    decision-timeout-ms: ${AUTHZ_DECISION_TIMEOUT_MS:500}
    cache:
      local-ttl-seconds: ${AUTHZ_CACHE_LOCAL_TTL_SECONDS:60}
      remote-ttl-seconds: ${AUTHZ_CACHE_REMOTE_TTL_SECONDS:300}
    catalog:
      registration-required: ${AUTHZ_CATALOG_REGISTRATION_REQUIRED:true}
      service-name: ${AUTHZ_SERVICE_NAME:arrecadacao}
      file: classpath:permissions.yaml
      service-token: ${AUTHZ_SERVICE_TOKEN:}
    idp:
      subject-claim: ${AUTHZ_SUBJECT_CLAIM:sub}
      session-id-claim: ${AUTHZ_SESSION_ID_CLAIM:sid}
      association-id-claim: ${AUTHZ_ASSOCIATION_ID_CLAIM:association_id}

audit:
  enabled: ${AUDIT_ENABLED:true}
  mode: ${AUDIT_MODE:OUTBOX_RABBITMQ}
  endpoint: ${AUDIT_ENDPOINT:http://localhost:8080/api/v1/audit/events}
  exchange: ${AUDIT_RABBITMQ_EXCHANGE:audit.events.exchange.v1}
  routing-key: ${AUDIT_RABBITMQ_ROUTING_KEY:audit.event.v1}
  relay-batch-size: ${AUDIT_RELAY_BATCH_SIZE:50}
  relay-lock-ttl: ${AUDIT_RELAY_LOCK_TTL:2m}
  relay-delay-ms: ${AUDIT_RELAY_DELAY_MS:5000}
